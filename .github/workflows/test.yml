name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile source
        run: python -m py_compile bot_manager.py
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
