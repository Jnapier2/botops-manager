name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile source
        run: python -m py_compile bot_manager.py
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Launch from an unrelated working directory
        shell: pwsh
        run: |
          $caller = Join-Path $env:RUNNER_TEMP 'botops-foreign-cwd'
          New-Item -ItemType Directory -Path $caller -Force | Out-Null
          Push-Location $caller
          try {
            & "$env:GITHUB_WORKSPACE\BotOps_Manager.bat" --root $env:GITHUB_WORKSPACE config
            $launchExit = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($launchExit -ne 0) { throw "BotOps launcher smoke failed with exit code $launchExit." }
          if (Test-Path -LiteralPath (Join-Path $caller 'state')) { throw 'BotOps wrote state under the caller working directory.' }

